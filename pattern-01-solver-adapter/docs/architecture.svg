<svg width="400" height="420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <style>
    .box { fill: #f8f9fa; stroke: #333; stroke-width: 2; rx: 5; }
    .text { font-family: Arial, sans-serif; font-size: 14px; text-anchor: middle; fill: #333; }
    .line { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
  </style>

  <!-- Business Service -->
  <rect x="100" y="20" width="200" height="50" class="box" />
  <text x="200" y="45" class="text" font-weight="bold">Business Service</text>
  <text x="200" y="62" class="text">RouteOptimizationSvc</text>

  <!-- Solver Adapter -->
  <rect x="100" y="120" width="200" height="40" class="box" />
  <text x="200" y="145" class="text">SolverAdapter</text>

  <!-- Classical Solver/Engine -->
  <rect x="50" y="220" width="130" height="50" class="box" />
  <text x="115" y="240" class="text">Classical</text>
  <text x="115" y="257" class="text">Solver</text>
  <rect x="50" y="320" width="130" height="50" class="box" />
  <text x="115" y="340" class="text">Classical</text>
  <text x="115" y="357" class="text">Engine</text>

  <!-- Quantum Solver/Engine -->
  <rect x="220" y="220" width="130" height="50" class="box" />
  <text x="285" y="240" class="text">Quantum</text>
  <text x="285" y="257" class="text">Solver</text>
  <rect x="220" y="320" width="130" height="50" class="box" />
  <text x="285" y="340" class="text">Quantum</text>
  <text x="285" y="357" class="text">Engine</text>

  <!-- Connections -->
  <path d="M 200 70 L 200 120" class="line" />
  <path d="M 200 160 L 200 190 L 115 190 L 115 220" class="line" />
  <path d="M 200 160 L 200 190 L 285 190 L 285 220" class="line" />
  <path d="M 115 270 L 115 320" class="line" />
  <path d="M 285 270 L 285 320" class="line" />
</svg>